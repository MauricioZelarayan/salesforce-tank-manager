<template>
    <lightning-card title="Tank Load Assistant" icon-name="custom:custom18">
        <div class="slds-p-around_medium">
            
            <lightning-progress-indicator current-step={currentStep} type="path" variant="base">
                <lightning-progress-step label="Type of Tank" value="1"></lightning-progress-step>
                <lightning-progress-step label="Load CSV" value="2"></lightning-progress-step>
                <lightning-progress-step label="Confirm" value="3"></lightning-progress-step>
            </lightning-progress-indicator>
            <br/>

            <template if:true={isStep1}>
                <div class="slds-box slds-theme_shade">
                    <p class="slds-m-bottom_medium"><strong>Step 1:</strong> Define the Tank Type.</p>
                    
                    <lightning-radio-group 
                        name="radioGroup"
                        label="What do you want to do?"
                        options={modeOptions}
                        value={mode}
                        type="button"
                        onchange={handleModeChange}
                        class="slds-m-bottom_medium">
                    </lightning-radio-group>

                    <template if:true={isModeSelect}>
                        <lightning-record-edit-form object-api-name="Industrial_Tank__c">
                            <lightning-input-field 
                                field-name="Tank_Type__c" 
                                required 
                                onchange={handleTypeSelection}>
                            </lightning-input-field>
                        </lightning-record-edit-form>
                    </template>

                    <template if:true={isModeCreate}>
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col">
                                <lightning-input label="Name" name="Name" value={newTypeData.Name} onchange={handleNewTypeChange} required></lightning-input>
                                <lightning-input label="Capacity" type="number" name="Capacity__c" value={newTypeData.Capacity__c} onchange={handleNewTypeChange} required></lightning-input>
                            </div>
                            <div class="slds-col">
                                <lightning-input label="Brand" name="Brand__c" value={newTypeData.Brand__c} onchange={handleNewTypeChange}></lightning-input>
                                <lightning-input label="List Price" type="number" formatter="currency" name="List_Price__c" value={newTypeData.List_Price__c} onchange={handleNewTypeChange} required></lightning-input>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="slds-align_absolute-center slds-m-top_medium">
                    <lightning-button label="Next" variant="brand" onclick={handleNext} disabled={disableNextStep1}></lightning-button>
                </div>
            </template>

            <template if:true={isStep2}>
                <div class="slds-box slds-theme_shade">
                    <p class="slds-m-bottom_small"><strong>Step 2:</strong> Upload CSV.</p>
                    <lightning-input type="file" label="CSV file" accept=".csv" onchange={handleFileUpload}></lightning-input>
                </div>
                <div class="slds-align_absolute-center slds-m-top_medium">
                    <lightning-button label="Back" onclick={goToStep1} class="slds-m-right_small"></lightning-button>
                </div>
            </template>

            <template if:true={isStep3}>
                <p class="slds-m-bottom_small"><strong>Step 3:</strong> Confirmation.</p>
                <div style="height: 300px;">
                    <lightning-datatable key-field="id" data={parsedData} columns={columns} hide-checkbox-column></lightning-datatable>
                </div>
                <div class="slds-align_absolute-center slds-m-top_medium">
                    <lightning-button label="Back" onclick={goToStep2} class="slds-m-right_small"></lightning-button>
                    <lightning-button label="Confirm and Create" variant="success" onclick={saveData}></lightning-button>
                </div>
            </template>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </template>

        </div>
    </lightning-card>
</template>
